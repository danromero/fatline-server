name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: shellcheck check.sh
      - run: npx wrangler deploy --dry-run
      # Set the SERVER_URL repository secret to check a live server every day.
      - name: Check the live server
        if: env.SERVER_URL != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: ./check.sh "$SERVER_URL"
